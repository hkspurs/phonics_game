    /* iOS Fullscreen & Add to Home Screen Floating Button */

<body>
  <!--
  THESIS: Dream Wardrobe is a magical mirror stage, not an icon catalog.
  OWN-WORLD: dark purple night, royal-blue stage, warm-gold rails and soft spotlight.
  STORY: choose a category, try the outfit on, understand its effect and price, then buy or wear it.
  FIRST VIEWPORT: 40% item rail on the left; 60% stage on the right with a 60%-height character and purchase panel below.
  FORM: Moonlit Mirror Stage, grounded direction candidate 3, seed e5d862dd; degraded roll, product brief pinned.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <!-- Fullscreen / iOS App Button -->
  <button id="fullscreen-btn" onclick="handleFullscreenClick()">
    <span>⛶</span> 全螢幕
  </button>

  <!-- iOS Safari PWA Tutorial Modal -->
  <div id="ios-pwa-modal" onclick="closeIosModal(event)">
    <div class="ios-modal-card" onclick="event.stopPropagation()">
      <div class="ios-modal-title">📱 iPhone 100% 滿版全螢幕教學</div>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 14px;">因 Apple 限制，iPhone 透過「加入主畫面」即可完全消除網址列及黑邊，滿版暢玩：</p>
      
      <div class="ios-step">
        <div class="ios-step-num">1</div>
        <div>點擊 Safari 下方或頂部的 <strong>「分享」按鈕 📤</strong></div>
      </div>
      <div class="ios-step">
        <div class="ios-step-num">2</div>
        <div>在選單中向下滑動，選擇 <strong>「加入主畫面 ➕」</strong></div>
      </div>
      <div class="ios-step">
        <div class="ios-step-num">3</div>
        <div>點擊右上角 <strong>「新增」</strong>，在桌面點擊圖示即可滿版全螢幕！</div>
      </div>

      <button class="ios-modal-close" onclick="closeIosModal()">我知道了，繼續遊玩</button>
    </div>
  </div>

  <!-- Mandatory Landscape Overlay in Portrait Mode -->
  <div id="orientation-warning">
    <div class="rotate-icon">📱</div>
    <div class="rotate-title">請將手機打橫</div>
    <div class="rotate-subtitle">打橫後，題目、答案同遊戲按鈕會更清楚。</div>
    <div class="rotate-badge">準備好就一齊出發！</div>
  </div>

  <div id="game-container"></div>
  <div id="screen-host"></div>
  <script>
    // Force purge any legacy service workers or stale PWA caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      }).catch(function() {});
    }
  </script>
  <script type="module" src="/src/main.ts"></script>

  <script>
    function isIosSafari() {
      const ua = window.navigator.userAgent;
      const isIos = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isWebkit = /WebKit/i.test(ua);
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      return isIos && isWebkit && !isStandalone;
    }

    function handleFullscreenClick() {
      if (isIosSafari()) {
        const modal = document.getElementById('ios-pwa-modal');
        if (modal) modal.style.display = 'flex';
      } else {
        if (!document.fullscreenElement) {
          const docEl = document.documentElement;
          if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => {
              const modal = document.getElementById('ios-pwa-modal');
              if (modal) modal.style.display = 'flex';
            });
          }
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      }
    }

    function closeIosModal() {
      const modal = document.getElementById('ios-pwa-modal');
      if (modal) modal.style.display = 'none';
    }

    // Try locking landscape on mobile interaction
    function tryLockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
    }

    window.addEventListener('touchstart', function() {
      window.scrollTo(0, 1);
      tryLockLandscape();
    }, { passive: true, once: true });

    window.addEventListener('click', function() {
      tryLockLandscape();
    }, { once: true });
  </script>
