<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>升夢大冒險 —— 香港小一學科闖關 | P1 Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      position: fixed;
      inset: 0;
      overflow: hidden;
      background-color: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Orientation Warning for Portrait on iPhone / iPad */
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px;
      backdrop-filter: blur(12px);
    }

    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #orientation-warning {
        display: flex;
      }
    }

    .rotate-icon {
      font-size: 72px;
      margin-bottom: 24px;
      display: inline-block;
      animation: phoneRotate 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes phoneRotate {
      0%, 15% {
        transform: rotate(0deg) scale(1);
      }
      50%, 65% {
        transform: rotate(-90deg) scale(1.1);
      }
      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    .rotate-title {
      font-size: 26px;
      font-weight: 800;
      color: #ffd700;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .rotate-subtitle {
      font-size: 16px;
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .rotate-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div id="orientation-warning">
    <div class="rotate-icon">📱</div>
    <div class="rotate-title">請旋轉至橫向螢幕</div>
    <div class="rotate-subtitle">《升夢大冒險》在橫向模式下字體最大、按鈕最好按、體驗最流暢 ✨</div>
    <div class="rotate-badge">🎮 橫向全螢幕鎖定推薦</div>
  </div>

  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
